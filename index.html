<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EpLocks AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9eff7; --fg:#0b1f3a; --mut:#53647d; --line:#d7e0ec;
  --acc:#087f5b; --on-acc:#ffffff; --gold:#a66f00; --good:#087f5b; --warn:#9a5600; --bad:#b3261e;
  --hdr:#0b1f3a; --hdr2:#10305a; --hdr-fg:#f2f6fc; --hdr-mut:#9fb2cc; --hdr-acc:#34d399;
  --shadow:0 8px 22px rgba(11,31,58,.14);
  --f-disp:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07152b; --surface:#0d2140; --surface2:#15305a; --fg:#e8eef8; --mut:#9db0cb; --line:#223f6b;
    --acc:#34d399; --on-acc:#04231a; --gold:#e6b02e; --good:#34d399; --warn:#f0a43a; --bad:#ff7a70;
    --hdr:#050f20; --hdr2:#0a2144; --shadow:0 10px 26px rgba(0,0,0,.55); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,var(--hdr),var(--hdr2));color:var(--hdr-fg);border-bottom:1px solid rgba(52,211,153,.4)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--hdr-acc)}
.brand svg .sh{transition:transform .25s ease}
.brand:hover svg .sh{transform:translateY(-2px)}
.wm{font:700 26px/1 var(--f-disp);letter-spacing:.06em;color:var(--hdr-fg)}
.wm b{color:var(--hdr-acc);font-weight:700}
.wm i{font-style:normal;color:var(--hdr-mut);margin-left:6px;font-weight:600}
.sync{font:12px var(--f-body);color:var(--hdr-mut);text-align:right}
.tabs{display:flex;gap:2px;margin-top:10px;position:relative;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;appearance:none;background:transparent;color:var(--hdr-mut);border:0;padding:10px 10px 11px;font:600 13px var(--f-body);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:44px;transition:color .15s ease}
.tabs button:hover,.tabs button[aria-selected="true"]{color:var(--hdr-fg)}
.tabs button.star{color:var(--hdr-acc)}
.tabs .ind{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--hdr-acc);border-radius:2px 2px 0 0;transition:transform .28s cubic-bezier(.3,.7,.3,1),width .28s cubic-bezier(.3,.7,.3,1)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--hdr-acc);color:#04231a;font:600 11px/18px var(--f-mono);text-align:center}
.count:empty{display:none}
main.in{padding-block:20px 56px}
section.narrow{max-width:820px;width:100%;margin-inline:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
section{display:grid;gap:14px}
h2{font:700 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:6px 0 0}
p{margin:0}
.mut{color:var(--mut)}
.small{font-size:13px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;overflow-wrap:anywhere}
.note.warn{border-color:var(--warn)}
.btn{appearance:none;font:600 14px var(--f-body);padding:8px 14px;min-height:40px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:border-color .15s ease,transform .12s ease}
.btn:hover{border-color:var(--fg)}
.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{appearance:none;background:transparent;color:var(--fg);border:0;padding:8px 12px;font:500 13px var(--f-body);cursor:pointer;min-height:36px;transition:background .15s ease}
.seg button:hover{background:var(--surface2)}
.seg button[aria-pressed="true"]{background:var(--surface2);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.game,.pick,.tile,.pgroup{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0;animation:rise .35s ease both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.game:hover,.pick:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--acc)}
.g-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.tip{font:500 12px var(--f-mono);color:var(--mut)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.good{border-color:var(--good);color:var(--good)}
[data-tip]{position:relative;cursor:help}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 6px);z-index:5;width:max-content;max-width:min(240px,66vw);background:var(--hdr);color:var(--hdr-fg);font:400 12px/1.4 var(--f-body);letter-spacing:0;text-transform:none;padding:6px 9px;border-radius:6px;box-shadow:var(--shadow);white-space:normal;text-align:left}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.team{min-width:0;display:grid}
.team.home{text-align:right}
.ab{font:700 40px/1 var(--f-disp);letter-spacing:.02em;display:inline-block;transition:color .18s ease,transform .18s ease}
.team.home .ab{justify-self:end}
.team:hover .ab{transform:scale(1.05)}
.team[data-side="away"]:hover .ab{color:var(--ca,var(--fg))}
.team[data-side="home"]:hover .ab{color:var(--ch,var(--fg))}
.nm{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.rec{font:500 12px var(--f-mono);color:var(--mut)}
.at{font:600 13px var(--f-disp);color:var(--mut);letter-spacing:.1em}
.wp{display:grid;grid-template-columns:var(--wa,1fr) var(--wh,1fr);height:8px;border-radius:4px;overflow:hidden;background:var(--surface2);gap:2px;transition:grid-template-columns .7s cubic-bezier(.2,.7,.2,1)}
.wp.pre{grid-template-columns:1fr 1fr}
.wp i{display:block;transition:opacity .18s ease}
.wp .a{background:var(--ca,var(--hdr-mut))}
.wp .h{background:var(--ch,var(--acc))}
.game[data-hot="away"] .wp .h,.game[data-hot="home"] .wp .a{opacity:.3}
.wpl{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--mut)}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.cell span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cell b{font:700 20px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cell small{display:block;font:500 11px var(--f-mono);color:var(--mut)}
details>summary{cursor:pointer;font-size:14px;color:var(--mut);min-height:32px;display:flex;align-items:center;transition:color .15s ease}
details>summary:hover{color:var(--fg)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover{background:var(--surface2)}
.ana{display:grid;gap:8px;font-size:14px}
.ana b.k{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block}
.ana ul{margin:2px 0 0;padding-left:18px}
.ana li{overflow-wrap:anywhere}
.lpick{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:grid;gap:2px;min-width:0;transition:padding-left .18s ease}
.lpick:hover{padding-left:14px}
.lpick.High{border-left-color:var(--good)}
.lpick.Medium{border-left-color:var(--gold)}
.lpick.Low{border-left-color:var(--mut)}
.lpick b{font-weight:600;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lock{width:18px;height:18px;flex:none;vertical-align:-3px}
.lock .sh{transition:transform .22s ease}
.lock.High{color:var(--good)}
.lock.Medium{color:var(--gold)}
.lock.Medium .sh{transform:translateY(-1.5px)}
.lock.Low{color:var(--mut)}
.lock.Low .sh{transform:translateY(-3.5px)}
.pick:hover .lock .sh,.lpick:hover .lock .sh{transform:translateY(0)}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rank{font:700 22px/1 var(--f-disp);color:var(--acc)}
.conf{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.conf.High{color:var(--good)}
.conf.Medium{color:var(--gold)}
.conf.Low{color:var(--mut)}
.p-title{font:700 26px/1.1 var(--f-disp);letter-spacing:.01em;margin:0;overflow-wrap:anywhere}
.p-title .mono{font-size:15px;color:var(--mut);font-weight:500;margin-left:6px}
.nums{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mut)}
.nums b{font:600 14px var(--f-mono);color:var(--fg)}
.nums b.pos{color:var(--good)}
.nums b.neg{color:var(--bad)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:8px 0 2px}
.meter .fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--good);opacity:.85;transition:opacity .18s ease}
.meter .fill.neg{background:var(--bad)}
.meter .mk{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;margin-left:-1px;transition:transform .18s ease}
.meter .mk.px{background:var(--mut)}
.meter .mk.ex{background:var(--fg)}
.pick:hover .meter .mk{transform:scaleY(1.3)}
.mlab{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--mut)}
.why{font-size:14px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.tile:hover{border-color:var(--mut);box-shadow:var(--shadow)}
.tile span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tile b{font:700 24px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pgroup.un{border-color:var(--warn)}
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface2);flex-wrap:wrap}
.pg-h b{font:700 20px var(--f-disp);letter-spacing:.04em}
.pg-h span{font:500 12px var(--f-mono);color:var(--mut);margin-left:8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;font:700 20px var(--f-disp);letter-spacing:.04em;color:var(--fg);margin-bottom:4px;text-transform:uppercase}
code{font:500 13px var(--f-mono);background:var(--surface2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.legal{margin-top:28px;font-size:12px;color:var(--mut)}
.src{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--good)}
.dot.bad{background:var(--bad)}

.hero{display:grid;gap:14px;background:linear-gradient(135deg,var(--hdr),var(--hdr2));color:var(--hdr-fg);border-radius:14px;padding:18px;border:1px solid rgba(52,211,153,.35)}
.hero h1{font:700 36px/1 var(--f-disp);letter-spacing:.02em;margin:0}
.hero p{color:var(--hdr-mut);font-size:13px;margin-top:4px}
.hero .tiles .tile{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--hdr-fg)}
.hero .tiles .tile span{color:var(--hdr-mut)}
.hero .tiles .tile b{color:var(--hdr-acc)}
.hero .tiles .tile:hover{border-color:var(--hdr-acc);box-shadow:none}
.ctl{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ctl .row>b{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);min-width:96px}
.ult{position:relative;overflow:hidden;display:grid;gap:12px;background:radial-gradient(120% 140% at 100% 0%,rgba(52,211,153,.28),transparent 55%),linear-gradient(135deg,var(--hdr),var(--hdr2));color:var(--hdr-fg);border:1px solid var(--hdr-acc);border-radius:16px;padding:18px;box-shadow:var(--shadow);animation:rise .4s ease both}
.ult .badge{justify-self:start;font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;background:var(--hdr-acc);color:#04231a;padding:3px 10px;border-radius:999px}
.ult h3{font:700 30px/1.05 var(--f-disp);margin:0;letter-spacing:.01em}
.ult .big{font:700 54px/1 var(--f-disp);color:var(--hdr-acc);font-variant-numeric:tabular-nums}
.ult .head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;justify-content:space-between}
.ult .mut,.ult .small{color:var(--hdr-mut)}
.ult .nums{color:var(--hdr-mut)}
.ult .nums b{color:var(--hdr-fg)}
.ult .nums b.pos{color:var(--hdr-acc)}
.ult .nums b.neg{color:#ff9d94}
.legs{display:grid;gap:8px}
.leg{display:grid;gap:2px;min-width:0;border-left:3px solid var(--line);padding:6px 0 6px 12px;background:rgba(127,150,185,.08);border-radius:0 8px 8px 0}
.leg.High{border-left-color:var(--good)}
.leg.Medium{border-left-color:var(--gold)}
.leg.Low{border-left-color:var(--mut)}
.leg b{font-weight:600;overflow-wrap:anywhere}
.leg .core{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-left:6px}
.ult .leg .core{color:var(--hdr-acc)}
.ult .leg{background:rgba(255,255,255,.06)}
.ult .btn{color:var(--hdr-fg);border-color:rgba(255,255,255,.4)}
.ult .btn:hover{border-color:var(--hdr-acc);color:var(--hdr-acc)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.ticket:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--acc)}
.ticket.is-ult{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.t-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.t-head h3{font:700 24px/1 var(--f-disp);margin:0;letter-spacing:.02em}
.t-odds{font:700 34px/1 var(--f-disp);color:var(--acc);font-variant-numeric:tabular-nums}
.chip{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--acc);color:var(--on-acc)}
.ctl .seg{max-width:100%;flex-wrap:wrap}

.av{display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border-radius:50%;background:var(--surface2);width:var(--s,40px);height:var(--s,40px);font:700 11px var(--f-body);color:var(--mut)}
.av img{width:100%;height:100%;display:block}
.av.logo{background:#fff;padding:12%;box-shadow:0 0 0 1px rgba(11,31,58,.12)}
.av.logo img{object-fit:contain}
.av.face{box-shadow:0 0 0 2px var(--acc)}
.av.face img{object-fit:cover;object-position:50% 0}
.avs{display:flex;align-items:center}
.avs .av{--s:36px}.avs .av+.av{margin-left:-8px}
.tm-row{display:flex;align-items:center;gap:10px}
.team.home .tm-row{flex-direction:row-reverse;justify-self:end}
.team .av{--s:48px}
.p-main{display:flex;gap:12px;align-items:flex-start}
.p-main>.av,.p-main>.avs{--s:56px}
.p-main>.avs .av{--s:40px}
.p-body{display:grid;gap:8px;min-width:0;flex:1}
.leg{display:flex;gap:10px;align-items:center}
.leg .av,.leg .avs{--s:36px}
.leg-body{display:grid;gap:2px;min-width:0}
.who{display:inline-flex;align-items:center;gap:8px}
.who .av{--s:28px}

.shots{display:grid;gap:12px;margin-top:6px}
.courts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cwrap{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:4px;min-width:0}
.cwrap h4{font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0}
.cwrap small{font:500 11px var(--f-mono);color:var(--mut)}
svg.court{width:100%;height:auto;display:block;border-radius:6px}
svg.court .bg{fill:var(--surface2)}
svg.court .ct-line{fill:none;stroke:var(--mut);stroke-width:3;opacity:.7}
svg.court .ct-lab{font:700 26px var(--f-body);fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
svg.court .ct-lab.sm{font-size:19px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.mini{display:grid;gap:2px;justify-items:center;text-align:center;min-width:0}
.mini b{font:600 12px var(--f-body);overflow-wrap:anywhere}
.mini small{font:500 10px var(--f-mono);color:var(--mut)}
.legend{display:flex;align-items:center;gap:8px;font:500 11px var(--f-mono);color:var(--mut);flex-wrap:wrap}
.legend i{display:block;width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(244,114,102,.9),rgba(148,163,184,.5),rgba(16,185,129,.9))}
@media (max-width:480px){.courts{grid-template-columns:1fr}.team .av{--s:38px}.hero h1{font-size:30px}.ult .big{font-size:44px}.ab{font-size:34px}.tiles{grid-template-columns:repeat(2,1fr)}.lines{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <div class="in">
    <div class="bar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3"/><rect x="5" y="11" width="14" height="9" rx="2"/></svg>
        <span class="wm">EP<b>LOCKS</b><i>AI</i></span>
      </div>
      <span class="sync" id="sync" aria-live="polite">Loading…</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="slate" aria-selected="true">Slate</button>
      <button role="tab" data-tab="picks" aria-selected="false">Picks<span class="count" id="cnt-picks"></span></button>
      <button role="tab" data-tab="parlays" class="star" aria-selected="false">Parlays</button>
      <button role="tab" data-tab="props" aria-selected="false">Props<span class="count" id="cnt-props"></span></button>
      <button role="tab" data-tab="track" aria-selected="false">Tracker</button>
      <button role="tab" data-tab="status" aria-selected="false">Status</button>

    var bks = Object.keys(st.buckets).map(Number).sort(function(a, b){ return a - b; });
    if (bks.length) root.append(table(['Estimated win chance', 'Picks', 'Model said', 'Actually won'], bks.map(function(k){ var b = st.buckets[k]; return [(k * 10) + '-' + (k * 10 + 10) + '%', b.n, pct(b.est / b.n), pct(b.w / b.n)]; })));
    root.append(el('p', {class:'small mut', text:'If "Model said" runs well above "Actually won" over a large sample, treat the model\'s probabilities as too high. Samples under about 30 picks per row mean very little.'}));
  }
  if (!H.length){ root.append(el('div', {class:'empty'}, el('b', {text:'Nothing logged yet'}), 'Today\'s picks are logged when the daily run publishes them and graded after the games finish.')); return; }
  root.append(el('h2', {text:'Pick history'}));
  H.slice().reverse().slice(0, 80).forEach(function(p){
    root.append(el('div', {class:'note'}, el('b', {text:p.label}), el('span', {class:'mono mut', text:' ' + fo(p.odds)}),
      el('p', {class:'small mut', text:[dayLabel(p.date), p.away + ' @ ' + p.home, p.conf, p.units + 'u', 'est ' + pct(p.est), p.result ? (p.result === 'V' ? 'void' : p.result + (p.profit != null ? ' ' + (p.profit >= 0 ? '+' : '') + p.profit.toFixed(2) + 'u' : '')) + (p.final ? ' · ' + p.final : '') : 'pending'].join(' · ')})));
  });
}

/* ---- status ---- */
function renderStatus(){
  var root = $('#status'); root.textContent = '';
  var L = S.latest; if (!L) return;
  root.append(el('div', {class:'note'}, el('b', {text:'Last run: '}), new Date(L.generated_at).toLocaleString(), el('br'),
    'Written analysis: ' + (L.model ? 'on, model ' + L.model : 'OFF (no API key)'), el('br'),
    'Model settings: home edge ' + L.params.home_edge + ' pts, margin spread ' + L.params.sd_margin + ', total spread ' + L.params.sd_total + ', back-to-back ' + L.params.b2b_points + ' pts.'));
  var sources = L.status.sources, names = {espn_games:'Game results and box scores', ratings:'Team ratings', espn_injuries:'Injury report', anthropic:'Claude analysis', props_parse:'Props read by Claude', prior_season:'Last season as a starting point', shot_data:'Shot locations (play-by-play)', calibration:'Self-check against graded results'};
  var box = el('div', {class:'note'}, el('div', {class:'src'}, Object.keys(sources).map(function(k){
    return [el('span', {class:'dot' + (sources[k].ok ? '' : ' bad')}), el('div', {}, el('b', {text:(names[k] || k) + (sources[k].ok ? '' : ' (problem)')}), el('p', {class:'small mut', text:sources[k].msg || ''}))];
  }).reduce(function(a, b){ return a.concat(b); }, [])));
  root.append(box);
  var anyBad = ['espn_games', 'ratings', 'espn_injuries', 'anthropic', 'props_parse'].some(function(k){ return sources[k] && !sources[k].ok; });
  if (!Object.keys(sources).length) root.append(el('div', {class:'note warn', text:'No source reports in the last run.'}));
  if (L.status.notes && L.status.notes.length) root.append(el('div', {class:'note warn'}, el('b', {text:'Notes from the last run'}), el('ul', {}, L.status.notes.map(function(n){ return el('li', {text:n}); }))));
  root.append(el('div', {class:'note'}, el('b', {text:'What this site does not know'}), el('p', {class:'small', text:'Coaching and referee data, travel distance, player tracking and shot quality are not loaded. Anything about coaching or scheme in the analysis is Claude\'s memory and is tagged that way. The market line already reflects public injury news, so the model only moves off it by a small, capped amount.'})));
  if (anyBad) root.append(el('div', {class:'note warn', text:'A source failed. Picks that depend on it are capped at Low confidence or skipped. Send this page\'s text to Claude to get it fixed.'}));
}

function renderCounts(){
  var L = S.latest; if (!L) return;
  var n = L.picks.filter(function(p){ return !S.hideLow || p.conf !== 'Low'; }).length;
  $('#cnt-picks').textContent = n ? String(n) : '';
  var pc = 0; L.games.forEach(function(g){ pc += (g.prop_rows || []).length; });
  $('#cnt-props').textContent = pc ? String(pc) : '';
  $('#sync').textContent = 'Updated ' + ago(L.generated_at);
}
function moveInd(){
  var sel = $('.tabs [aria-selected="true"]'), ind = $('.tabs .ind'); if (!sel || !ind) return;
  ind.style.width = sel.offsetWidth + 'px'; ind.style.transform = 'translateX(' + sel.offsetLeft + 'px)';
}
function showTab(t){
  S.tab = t;
  ['slate', 'picks', 'parlays', 'props', 'track', 'status'].forEach(function(x){
    $('#' + x).hidden = t !== x;
    var b = $('.tabs [data-tab="' + x + '"]'); b.setAttribute('aria-selected', String(t === x));
  });
  moveInd();
  ({slate:renderSlate, picks:renderPicks, parlays:renderParlays, props:renderProps, track:renderTracker, status:renderStatus})[t]();
  try { if (location.hash.slice(1) !== t) history.replaceState(null, '', '#' + t); } catch(e){}
}
document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick = function(){ showTab(b.getAttribute('data-tab')); }; });
window.addEventListener('resize', moveInd);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);

function getJson(url, fallback){
  return fetch(url + '?v=' + Date.now(), {cache:'no-store'}).then(function(r){ if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }).catch(function(e){ if (fallback !== undefined) return fallback; throw e; });
}
Promise.all([getJson('data/latest.json'), getJson('data/history.json', [])]).then(function(r){
  S.latest = r[0]; S.history = Array.isArray(r[1]) ? r[1] : [];
  renderCounts();
  var h = (location.hash || '').slice(1);
  showTab(['slate', 'picks', 'parlays', 'props', 'track', 'status'].indexOf(h) >= 0 ? h : 'slate');
}).catch(function(e){
  S.err = 'The first daily run has not published data yet, or the file could not be read. (' + e.message + ')';
  $('#sync').textContent = 'No data yet'; renderSlate(); moveInd();
});
})();
</script>
</body>
</html>
