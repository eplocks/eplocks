name: EpLocks daily run

on:
  schedule:
    # 15:00 UTC = 10:00 AM CDT: early look. 20:00 UTC = 3:00 PM CDT: props are bought and the card is posted, with time to spare
    # before 6 PM tips even when GitHub starts the run late. 22:30 UTC = 5:30 PM CDT: refresh (reuses the afternoon props on a small plan).
    # All one hour earlier on the clock after Nov 1.
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"
    # every 20 minutes from 4 PM to midnight Central: saves each pick's closing line just before tip-off and checks the injury report;
    # when a rotation player is newly ruled out (or back) it reruns the card and sends new picks to your phone
    - cron: "*/20 22-23,0-5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = full update, closing = save closing lines (and check injury news) now, replay = check the prop model against last season, backtest = replay last season against its lines"
        default: "run"
        type: choice
        options: [run, closing, replay, backtest]
  push:
    paths:
      - "props.txt"
      - "notes.txt"
      - "refs.txt"
      - "replay.txt"

permissions:
  contents: write

concurrency:
  group: eplocks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EPLOCKS_PROP_MARKETS: ${{ vars.EPLOCKS_PROP_MARKETS }}
          EPLOCKS_MODEL: ${{ vars.EPLOCKS_MODEL }}
          EPLOCKS_SEASON_START: ${{ vars.EPLOCKS_SEASON_START }}
          EPLOCKS_JUDGMENT_WEIGHT: ${{ vars.EPLOCKS_JUDGMENT_WEIGHT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "*/20 22-23,0-5 * * *" ]; then MODE=closing; fi
          case "$MODE" in
            closing) python eplocks.py --closing ;;
            backtest) python eplocks.py --backtest ;;
            replay) echo "replay runs in the next step" ;;
            *) python eplocks.py ;;
          esac
      - name: Replay past seasons (runs until it has finished once, or when replay.txt changes)
        if: ${{ github.event.schedule != '*/20 22-23,0-5 * * *' && inputs.mode != 'closing' }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          EPLOCKS_REPLAY_SECONDS: "2400"
        run: |
          DONE=$(python -c "import json; print(json.load(open('data/prop_replay.json')).get('complete', False))" 2>/dev/null || echo False)
          ASKED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -c '^replay.txt$' || true)
          if [ "$DONE" != "True" ] || [ "$ASKED" != "0" ] || [ "${{ inputs.mode }}" = "replay" ]; then python eplocks.py --replay; else echo "Replay already complete; edit replay.txt to run it again"; fi
      - name: Save results
        if: ${{ always() }}
        run: |
          git config user.name "eplocks-bot"
          git config user.email "eplocks-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "Nothing changed" || (git commit -m "EpLocks update" && git pull --rebase origin ${{ github.ref_name }} && git push)
